# claritia-intel on Fly.io: stitch now; IP lookups, enrichment, signals and scores next. Always on, no browser.
# Secrets: DATABASE_URL (Supabase pooler, session mode), SECRETS_KEY (same as claritia-web), SUPABASE_URL and
# SUPABASE_SECRET_KEY (import files), and each sign-in app's <PREFIX>_CLIENT_ID and _CLIENT_SECRET (docs/sources-setup.md).
#   fly deploy --config fly.intel.toml
app = "claritia-intel"
primary_region = "nrt" # Tokyo, next to Supabase
kill_timeout = 30

[build]
  dockerfile = "worker-intel/Dockerfile"

[http_service]
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB: big Excel imports read in steady memory, but the reader and a 5,000-row page need the room.
  memory = "1gb"
