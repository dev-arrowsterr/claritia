# Render Blueprint: the site and the app. Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: claritia
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SECRETS_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Sources (docs/sources-setup.md). APP_URL only when the app isn't at https://app.tryclaritia.com.
      - key: APP_URL
        sync: false
      - key: OMNISCIENT_URL
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: PIPEDRIVE_CLIENT_ID
        sync: false
      - key: PIPEDRIVE_CLIENT_SECRET
        sync: false
      - key: ATTIO_CLIENT_ID
        sync: false
      - key: ATTIO_CLIENT_SECRET
        sync: false
      - key: MAILCHIMP_CLIENT_ID
        sync: false
      - key: MAILCHIMP_CLIENT_SECRET
        sync: false
      # Sending (docs/sending-setup.md): the SNS topic SES events come from.
      - key: SES_SNS_TOPIC_ARN
        sync: false
      # Forms (docs/conversion-parity.md Part 21g): Cloudflare Turnstile, optional per form.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # AI: nurture drafts and the GitHub flow.
      - key: ANTHROPIC_API_KEY
        sync: false
