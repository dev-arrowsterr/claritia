# The Claritia app on Fly.io (app.tryclaritia.com). The site, tryclaritia.com, is a plain HTML site on Hostinger.
#   fly deploy
app = "claritia-web"
primary_region = "nrt" # Tokyo, next to the Supabase database

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: app.tryclaritia.com never sleeps, so no one waits for it to wake.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
