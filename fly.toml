# The Claritia site and app on Fly.io (tryclaritia.com and app.tryclaritia.com).
#   fly deploy
app = "claritia-web"
primary_region = "nrt" # Tokyo, next to the Supabase database

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Sleeps when nobody visits, and wakes on the next request (a page, or a Stripe or Resend webhook).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
