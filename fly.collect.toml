# claritia-collect on Fly.io: takes events from claritia.js. Public and always on.
# Secrets: DATABASE_URL (Supabase pooler, session mode), CLR_ID_SECRET (32+ chars), IPINFO_TOKEN (country file).
#   fly deploy --config fly.collect.toml
app = "claritia-collect"
primary_region = "nrt" # Tokyo, next to Supabase
kill_timeout = 30

[build]
  dockerfile = "collect/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
